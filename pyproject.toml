[project]
name = "mini-perplexity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "ollama>=0.3.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "mcp[cli]>=1.18.0",
    "sqlalchemy>=2.0.44",
